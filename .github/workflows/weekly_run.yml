name: Weekly Taiwan Stock Market Report

on:
  schedule:
    # Taiwan time Friday 15:00-23:00 = UTC Friday 07:00-15:00.
    # Once the dated backup PDF exists, later hourly runs stop before generating.
    - cron: '0 7-15 * * 5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '忽略同週已產出檢查，強制重新產生並更新 PDF'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  run-weekly-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install yfinance pandas requests playwright google-api-python-client google-auth
          playwright install --with-deps chromium

      - name: Run weekly tracking report
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WEEKLY_REPORT_DRIVE_FOLDER_ID: ${{ secrets.WEEKLY_REPORT_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || vars.GOOGLE_DRIVE_FOLDER_ID }}
          PUBLIC_REPORT_DRIVE_FOLDER_ID: ${{ vars.PUBLIC_REPORT_DRIVE_FOLDER_ID }}
          PUBLIC_REPORT_DRIVE_FILE_ID: ${{ vars.PUBLIC_REPORT_DRIVE_FILE_ID }}
          FORCE_RUN_REPORT: ${{ github.event.inputs.force_run || 'false' }}
        run: python stock_market_tracking_system.py
