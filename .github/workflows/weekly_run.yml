name: Weekly Taiwan Stock Market Report

on:
  schedule:
    # Wake hourly so a failed weekly report can keep retrying across days
    # without a 23:00 cutoff. The runtime gate reads AI_stock_schedule_rules,
    # starts only after the weekly profile's run_after on the week's actual
    # final TWSE trading day, and stops once the Drive backup PDF exists.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '忽略同週已產出檢查，強制重新產生並更新 PDF'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_drive_folder_id:
        description: '選填：驗收模式 Drive 資料夾 ID；免費固定 PDF 只上傳至此資料夾'
        required: false
        default: ''
        type: string

jobs:
  run-weekly-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout schedule rules
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: AI_stock_schedule_rules

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install yfinance pandas requests playwright google-api-python-client google-auth

      - name: Check whether a weekly report is pending
        id: schedule-gate
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WEEKLY_REPORT_DRIVE_FOLDER_ID: ${{ secrets.WEEKLY_REPORT_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || vars.GOOGLE_DRIVE_FOLDER_ID }}
          FORCE_RUN_REPORT: ${{ github.event.inputs.force_run || 'false' }}
          REPORT_TEST_DRIVE_FOLDER_ID: ${{ github.event.inputs.test_drive_folder_id || '' }}
          SCHEDULE_RULES_PATH: ${{ github.workspace }}/AI_stock_schedule_rules/schedule_rules.json
        run: python stock_market_tracking_system.py --schedule-gate

      - name: Install Chromium
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run weekly tracking report
        if: steps.schedule-gate.outputs.should_run == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WEEKLY_REPORT_DRIVE_FOLDER_ID: ${{ secrets.WEEKLY_REPORT_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || vars.GOOGLE_DRIVE_FOLDER_ID }}
          PUBLIC_REPORT_DRIVE_FOLDER_ID: ${{ vars.PUBLIC_REPORT_DRIVE_FOLDER_ID }}
          PUBLIC_REPORT_DRIVE_FILE_ID: ${{ vars.PUBLIC_REPORT_DRIVE_FILE_ID }}
          FORCE_RUN_REPORT: ${{ github.event.inputs.force_run || 'false' }}
          REPORT_TEST_DRIVE_FOLDER_ID: ${{ github.event.inputs.test_drive_folder_id || '' }}
          SCHEDULE_RULES_PATH: ${{ github.workspace }}/AI_stock_schedule_rules/schedule_rules.json
        run: python stock_market_tracking_system.py
