name: Weekly Taiwan Stock Market Report

on:
  schedule:
    # Wake only during Taipei weekday afternoons/evenings. The shared TWSE gate
    # runs only on the week's actual final trading day.
    - cron: '0 7-15 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '手動 Action 永遠強制重新產生；此欄位僅保留相容性'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      test_drive_folder_id:
        description: '選填：驗收模式 Drive 資料夾 ID；免費固定 PDF 只上傳至此資料夾'
        required: false
        default: ''
        type: string
      report_date:
        description: '精確補跑的週報最後交易日，YYYY-MM-DD；指定後不可改用其他日期'
        required: false
        default: ''
        type: string

concurrency:
  group: weekly-taiwan-stock-market-report
  cancel-in-progress: false

jobs:
  run-weekly-signal:
    runs-on: ubuntu-latest
    # 完整週報單次可需8分鐘；保留三次資料重抓所需時間。
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout schedule rules
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: AI_stock_schedule_rules

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check shared weekly trading-day gate
        id: trading-day-gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch_bypass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=AI_stock_schedule_rules python -m stock_schedule_rules.gate --profile weekly --github-output "$GITHUB_OUTPUT"

      - name: Stop outside the weekly trading-day window
        if: steps.trading-day-gate.outputs.should_run != 'true'
        run: echo "Shared schedule gate skipped this run. reason=${{ steps.trading-day-gate.outputs.reason }}"

      - name: Install Python packages
        if: steps.trading-day-gate.outputs.should_run == 'true'
        run: |
          pip install yfinance pandas requests playwright google-api-python-client google-auth

      - name: Check whether a weekly report is pending
        id: schedule-gate
        if: steps.trading-day-gate.outputs.should_run == 'true'
        # The repo gate also stops when the fixed public Drive PDF is current.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WEEKLY_REPORT_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          GOOGLE_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          FORCE_RUN_REPORT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MANUAL_RERUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REPORT_TEST_DRIVE_FOLDER_ID: ${{ github.event.inputs.test_drive_folder_id || '' }}
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          SCHEDULE_RULES_PATH: ${{ github.workspace }}/AI_stock_schedule_rules/schedule_rules.json
        run: python stock_market_tracking_system.py --schedule-gate

      - name: Install Chromium
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run weekly tracking report
        if: steps.schedule-gate.outputs.should_run == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WEEKLY_REPORT_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          GOOGLE_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          PUBLIC_REPORT_DRIVE_FOLDER_ID: 16SmfPgMMIs7MWteeX1h2EkhSIEaGvpHn
          PUBLIC_REPORT_DRIVE_FILE_ID: ""
          FORCE_RUN_REPORT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MANUAL_RERUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REPORT_TEST_DRIVE_FOLDER_ID: ${{ github.event.inputs.test_drive_folder_id || '' }}
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          SCHEDULE_RULES_PATH: ${{ github.workspace }}/AI_stock_schedule_rules/schedule_rules.json
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            python stock_market_tracking_system.py
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            if [ "$attempt" -lt 3 ]; then
              wait_minutes=$((attempt * 3))
              echo "週報目標交易日資料尚未齊（${attempt}/3），${wait_minutes}分鐘後重新下載。"
              sleep $((wait_minutes * 60))
            fi
          done
          echo "::error::三次下載後週報目標交易日資料仍未齊；未發布舊報告，交由下一排程與外部監控補救。"
          exit 75
